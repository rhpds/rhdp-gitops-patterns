#   namespace: tenant-lifecycle

# Pinned snapshot. Re-verify per target OCP version at generation time.
catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

# CNV operator: copy from this example. Multi-VM travel app: modernize-ocp-virt.
cnv:
  channel: stable
  source: rhpds-redhat-operators
  sourceNamespace: openshift-marketplace
  namespace: openshift-cnv
