# PURPOSE: OpenVSX registry + image-sync + CheCluster wired to OpenVSX. NOT FOR: vanilla DevSpaces+Gitea (gitea-devspaces).
# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Pinned snapshot. Re-verify per target OCP version at generation time.
catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

# GOTCHA: CheCluster CRD comes from this operator. Subscription is pinned to CatalogSource rhpds-redhat-operators (not the live redhat-operators index).
devspaces:
  operator:
    name: devspaces
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    channel: stable

cheCluster:
  name: devspaces
  namespace: openshift-devspaces
  container:
    source: ghcr.io/ansible/ansible-devspaces:v26.4.5

eeImage: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

# GOTCHA: openvsx.pat is already base64 (Secret `data`, not stringData). Setup Job inserts that same token into postgres; leave the demo postgres password as-is. PVC sizes: extensions 2Gi, postgres 10Gi.
openvsx:
  enabled: true
  namespace: openvsx
  extensionsStorageCapacity: 2Gi
  image: registry.redhat.io/devspaces/openvsx-rhel9:3.27
  importExtensionsImage: registry.access.redhat.com/ubi9/nodejs-22:latest
  ocCliImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  route:
    name: openvsx-server
    host: ""
  setup:
    name: openvsx-setup
  pat: ZWNsaXBzZV9jaGVfdG9rZW4=
  postgres:
    storage: 10Gi
    database: openvsx
    username: openvsx
    password: openvsx
    image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el8

imageSync:
  enabled: true
  name: image-sync
  image: registry.redhat.io/rhel10/skopeo:latest
  ocCliImage: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
