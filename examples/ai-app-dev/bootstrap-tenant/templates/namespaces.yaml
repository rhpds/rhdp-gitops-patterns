apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.username }}-{{ .Values.namespaceSuffix }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
{{- if .Values.vm }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.username }}-vm
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
{{- end }}
