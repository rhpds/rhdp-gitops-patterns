{{ if .Values.cnv -}}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kubevirt-hyperconverged
  namespace: {{ .Values.cnv.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,DisableResourceHealthCheck=true
spec:
  channel: {{ .Values.cnv.channel }}
  installPlanApproval: Automatic
  name: kubevirt-hyperconverged
  source: {{ .Values.cnv.source }}
  sourceNamespace: {{ .Values.cnv.sourceNamespace }}
{{- end }}
