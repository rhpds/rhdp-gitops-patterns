# PURPOSE: Gitea operator (CatalogSource+Subscription in openshift-operators, no OperatorGroup) + shared Gitea CR + DevSpaces CheCluster. NOT FOR: per-user Gitea, repo-migrate GOTCHAs, OpenVSX, per-user ArgoCD.
# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Shared namespace for tenant cleanup jobs. Set to "" to disable.
tenantLifecycle: ""

# Pinned snapshot. Re-verify per target OCP version at generation time.
catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

gitea:
  namespace: gitea
  name: gitea
  adminUser: gitea-admin
  adminPassword: openshift
  adminEmail: gitea-admin@demo.redhat.com
  volumeSize: 5Gi
  postgresqlVolumeSize: 5Gi
  ssl: true

devspaces:
  namespace: openshift-devspaces
  operator:
    name: devspaces
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    channel: stable
  cheCluster:
    name: devspaces
