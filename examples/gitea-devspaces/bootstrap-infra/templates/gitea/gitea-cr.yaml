# CRD comes from gitea-operator; SkipDryRunOnMissingResource required.
apiVersion: pfe.rhpds.com/v1
kind: Gitea
metadata:
  name: {{ .Values.gitea.name }}
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  giteaVolumeSize: {{ .Values.gitea.volumeSize }}
  postgresqlVolumeSize: {{ .Values.gitea.postgresqlVolumeSize }}
  giteaSsl: {{ .Values.gitea.ssl }}
  giteaAdminUser: {{ .Values.gitea.adminUser }}
  giteaAdminPassword: {{ .Values.gitea.adminPassword }}
  giteaAdminEmail: {{ .Values.gitea.adminEmail }}
