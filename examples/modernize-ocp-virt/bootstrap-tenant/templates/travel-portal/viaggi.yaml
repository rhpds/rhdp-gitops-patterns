---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viaggi
  namespace: {{ .Values.username }}-travel-portal
  annotations:
    # GOTCHA: wave 2 so portal Deployments cannot deadlock wave-1 VMs.
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app: viaggi
      version: v1
  replicas: 1
  # GOTCHA: initContainer waits for travels-vm HTTP; default 600s deadline Degrades ArgoCD.
  progressDeadlineSeconds: 7200
  template:
    metadata:
      annotations:
        readiness.status.sidecar.istio.io/applicationPorts: ""
      labels:
        app: viaggi
        version: v1
    spec:
      # GOTCHA: demo_travels_portal panics if travels-vm is not yet serving HTTP.
      initContainers:
        - name: wait-for-agency
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "waiting for travels-vm:8000"
              until (echo >/dev/tcp/travels-vm.{{ .Values.username }}-travel-agency/8000) >/dev/null 2>&1; do
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: control
          image: quay.io/kiali/demo_travels_portal:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            privileged: false
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 128Mi
          env:
            - name: LISTEN_ADDRESS
              value: ':8000'
            - name: PORTAL_COORDINATES
              value: '41.890668,12.492194'
            - name: PORTAL_COUNTRY
              value: 'Italy'
            - name: PORTAL_NAME
              value: 'viaggi.it'
            - name: TRAVELS_AGENCY_SERVICE
              value: 'http://travels-vm.{{ .Values.username }}-travel-agency:8000'
---
apiVersion: v1
kind: Service
metadata:
  name: viaggi
  namespace: {{ .Values.username }}-travel-portal
  labels:
    app: viaggi
spec:
  ports:
    - name: http
      port: 8000
  selector:
    app: viaggi
