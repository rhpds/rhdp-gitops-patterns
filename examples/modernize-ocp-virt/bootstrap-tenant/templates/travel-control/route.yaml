# GOTCHA: Gateway Route stays in shared istio-gateway; all other tenant resources stay in username-* namespaces.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.username }}
  namespace: istio-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  to:
    kind: Service
    name: gateway-shared-istio
  port:
    targetPort: http
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.username }}-ingress
  namespace: istio-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  to:
    kind: Service
    name: gateway-shared-istio
  port:
    targetPort: http
  tls:
    termination: edge
