# One CatalogSource for every redhat-operators Subscription in this chart.
# GOTCHA: OLM resolves kubevirt-hyperconverged and servicemeshoperator3 against ALL catalogs.
# If this CatalogSource is not READY yet, those Subscriptions hit ResolutionFailed, ArgoCD
# marks them Degraded, and wave 1 (HyperConverged/Istio/Gateway) never applies.
# Wave -5 creates it; wait-rhpds-catalog (wave -3 hook) blocks Subscriptions until READY.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: rhpds-redhat-operators
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  sourceType: grpc
  image: {{ .Values.catalog.redhatOperatorsImage }}
  displayName: RHPDS Pinned Snapshot (redhat-operators)
  publisher: Red Hat GPTE
