{{ if .Values.tenant -}}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant
  namespace: openshift-gitops
spec:
  generators:
  - list:
      elements:
{{- $userCount := int .Values.user.count }}
{{- range $index := until $userCount }}
      - user: {{ $.Values.user.prefix }}{{ add $index 1}}
{{- end }}
  template:
    metadata:
      name: tenant-{{- "{{" }} user {{- " }}" }}
      namespace: openshift-gitops
    spec:
      project: default
      source:
        repoURL: {{ .Values.tenant.git.url }}
        targetRevision: {{ .Values.tenant.git.revision }}
        path: {{ .Values.tenant.git.path }}
        helm:
          values: |
            username: '{{- "{{" }} user {{- " }}" }}'
            deployer:
              domain: {{ .Values.deployer.domain }}
            jobAnsibleImage: {{ .Values.jobAnsibleImage }}
            tenantLifecycleNamespace: {{ .Values.tenantLifecycleNamespace }}
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: false
          selfHeal: false
{{- end }}
