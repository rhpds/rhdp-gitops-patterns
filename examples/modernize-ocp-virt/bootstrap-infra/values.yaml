# PURPOSE: COPY WHEN: Istio Gateway + multi-VM travel tenant + per-user ArgoCD. NOT FOR: GitLab/DevHub (ai-app-dev), simple VM (ocp-virt-lab).
# CNV/HyperConverged: copy from examples/ocp-virt-lab. GitLab/DevHub: copy from examples/ai-app-dev.
# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Shared namespace for tenant cleanup jobs. Set to "" to disable.
tenantLifecycle: ""
# tenantLifecycle:
#   namespace: tenant-lifecycle

# Pinned snapshot. Re-verify per target OCP version at generation time.
catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

# CNV operator: copy from examples/ocp-virt-lab.
cnv:
  channel: stable
  source: rhpds-redhat-operators
  sourceNamespace: openshift-marketplace
  namespace: openshift-cnv

# OSSM 3 for GatewayClass istio (shared Istio Gateway).
servicemesh:
  channel: stable
  source: rhpds-redhat-operators
  sourceNamespace: openshift-marketplace
  istioVersion: v1.30-latest
