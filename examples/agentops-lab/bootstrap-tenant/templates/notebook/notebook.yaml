# GOTCHA: RHOAI notebook-controller injects oauth-proxy, CA bundle env/volumes, and Elyra mounts.
# List those fields here or ArgoCD stays OutOfSync. MLFLOW_TRACKING_URI is stripped by the
# connection-notebook.opendatahub.io webhook — do not set it (MODEL_* env vars pass through).
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: workbench
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    opendatahub.io/dashboard: "true"
spec:
  template:
    spec:
      containers:
        - name: workbench
          image: {{ .Values.workbench.image }}
          env:
            - name: MODEL_NAME
              value: {{ .Values.aiModels.modelName | quote }}
            - name: MODEL_ENDPOINT
              value: "http://{{ .Values.aiModels.modelName }}-predictor.{{ .Values.aiModels.namespace }}.svc.cluster.local"
            - name: PIPELINES_SSL_SA_CERTS
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: KF_PIPELINES_SSL_SA_CERTS
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: GIT_SSL_CAINFO
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: PIP_CERT
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
            - name: SSL_CERT_FILE
              value: /etc/pki/tls/custom-certs/ca-bundle.crt
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workbench-data
              mountPath: /opt/app-root/src
            - name: trusted-ca
              mountPath: /etc/pki/tls/custom-certs
              readOnly: true
            - name: runtime-images
              mountPath: /opt/app-root/pipeline-runtimes/
            - name: elyra-dsp-details
              mountPath: /opt/app-root/runtimes
      volumes:
        - name: workbench-data
          persistentVolumeClaim:
            claimName: workbench-data
        - name: trusted-ca
          configMap:
            name: workbench-trusted-ca-bundle
            optional: true
        - name: runtime-images
          configMap:
            name: pipeline-runtime-images
            optional: true
        - name: elyra-dsp-details
          secret:
            optional: true
            secretName: ds-pipeline-config
