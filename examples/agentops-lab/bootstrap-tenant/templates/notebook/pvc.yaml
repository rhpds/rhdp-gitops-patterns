# GOTCHA: same sync-wave as notebook.yaml. WaitForFirstConsumer PVC one wave ahead deadlocks ArgoCD (never binds, next wave never starts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbench-data
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.workbench.storageSize }}
