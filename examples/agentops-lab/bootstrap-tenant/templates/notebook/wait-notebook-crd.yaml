# GOTCHA: SkipDryRunOnMissingResource still applies. A failed Notebook apply plus a
# WaitForFirstConsumer PVC in the same wave deadlocks (ArgoCD waits on the PVC, never retries the Notebook).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wait-notebook-crd
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.username }}-wait-notebook-crd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.username }}-wait-notebook-crd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.username }}-wait-notebook-crd
subjects:
  - kind: ServiceAccount
    name: wait-notebook-crd
    namespace: {{ .Values.username }}-ai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-notebook-crd
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      serviceAccountName: wait-notebook-crd
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for notebooks.kubeflow.org"
              for i in $(seq 1 90); do
                if oc get crd notebooks.kubeflow.org >/dev/null 2>&1; then
                  echo "notebooks.kubeflow.org is present"
                  exit 0
                fi
                sleep 10
              done
              echo "ERROR: timed out waiting for notebooks.kubeflow.org"
              exit 1
