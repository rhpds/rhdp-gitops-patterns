apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-manage
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-manage-rb
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: minio-manage
    namespace: {{ .Values.username }}-ai
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-buckets
  namespace: {{ .Values.username }}-ai
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: minio-manage
      restartPolicy: Never
      containers:
        - name: create-buckets
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for minio pod in {{ .Values.username }}-ai namespace"
              oc -n {{ .Values.username }}-ai wait pod -l app=minio --for=condition=Ready --timeout=180s
              echo "Minio pod is running in {{ .Values.username }}-ai namespace"
              {{- range $bucket := .Values.minio.buckets }}
              oc -n {{ $.Values.username }}-ai rsh `oc -n {{ $.Values.username }}-ai get pod -l app=minio -o name` mkdir -p /data/{{ $bucket.name }}
              echo "{{ $bucket.name }} bucket is created."
              {{- end }}
