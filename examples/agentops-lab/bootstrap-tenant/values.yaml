# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

username: user1

namespaces:
  - ai

# Shared model-serving endpoint (see bootstrap-infra aiModels) — used to wire
# the workbench's MODEL_ENDPOINT env var.
aiModels:
  namespace: ai-models
  modelName: qwen-05b

# RHOAI workbench (Notebook CR), one per tenant. RHOAI's
# s2i-generic-data-science-notebook ImageStream has no "latest" tag, only
# version-pinned ones (1.2, 2023.1 ... 3.4 as of RHOAI 3.4.3) — check
# `oc get imagestream <name> -n redhat-ods-applications` for the real tag,
# don't assume "latest" exists on any RHOAI ImageStream.
workbench:
  image: "image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:3.4"
  storageSize: 10Gi

# Per-tenant MinIO — object storage backing the DSPA's pipeline artifacts.
minio:
  password: openshift
  storageSize: 20Gi
  buckets:
    - name: pipeline
