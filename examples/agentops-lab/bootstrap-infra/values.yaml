# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Shared namespace for tenant cleanup jobs. Set to "" to disable.
tenantLifecycle: ""
# tenantLifecycle:
#   namespace: tenant-lifecycle

catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

# RHOAI install is a dependency. For DataScienceCluster+models without Grafana/MLflow/notebooks, copy examples/ai-dev-workshop.
# GOTCHA: channel >=stable-3.4 — mlflowoperator and aipipelines do not exist on 3.3.
rhoai:
  channel: stable-3.4
  source: rhpds-redhat-operators
  sourceNamespace: openshift-marketplace

aiModels:
  namespace: ai-models
  modelName: qwen-05b
  ociImage: "oci://quay.io/redhat-ai-services/modelcar-catalog:qwen2.5-0.5b-instruct"
  runtimeImage: "quay.io/rh-aiservices-bu/vllm-cpu-openai-ubi9:0.3"

# GOTCHA: user workload monitoring must be enabled or Grafana/thanos-querier returns no data.
clusterMonitoringConfig:
  enableUserWorkload: true
  prometheusK8s:
    retention: 24h
    volumeClaimTemplate:
      spec:
        volumeMode: Filesystem
        resources:
          requests:
            storage: 10Gi
userWorkloadMonitoringConfig:
  prometheus:
    retention: 24h
    volumeClaimTemplate:
      spec:
        volumeMode: Filesystem
        resources:
          requests:
            storage: 10Gi

# Grafana Operator is community-operators (not covered by verify_operator_channel.py).
# GOTCHA: sessionSecret must be non-empty — unseeded randAlphaNum re-renders every sync (permanent OutOfSync).
grafana:
  namespace: grafana
  channel: v5
  source: community-operators
  sourceNamespace: openshift-marketplace
  sessionSecret: "changeme-oauth-proxy-session-secret"

# GOTCHA: MLflow CR is cluster-scoped — one per cluster; Service always in redhat-ods-applications. Never per-tenant.
mlflow:
  storage:
    size: 5Gi
  backend:
    storeUri: "sqlite:////mlflow/mlflow.db"
  artifacts:
    destination: "file:///mlflow/artifacts"
    serve: true
