# GOTCHA: cluster-scoped CR — namespace is ignored; Service always lands in redhat-ods-applications. One per cluster.
# Requires mlflowoperator: Managed. Wave 4 after wait-rhoai-crds. Live: https://mlflow.redhat-ods-applications.svc:8443.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.mlflow.storage.size }}
  backendStoreUri: {{ .Values.mlflow.backend.storeUri | quote }}
  artifactsDestination: {{ .Values.mlflow.artifacts.destination | quote }}
  serveArtifacts: {{ .Values.mlflow.artifacts.serve }}
