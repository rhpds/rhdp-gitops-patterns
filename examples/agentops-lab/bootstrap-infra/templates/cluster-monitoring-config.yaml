# Must sync before Grafana's datasource (wave 2) so thanos-querier and the
# user-workload Prometheus have time to come up.
{{- with .Values.clusterMonitoringConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  config.yaml: |
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .Values.userWorkloadMonitoringConfig }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  config.yaml: |
    {{- toYaml . | nindent 4 }}
{{- end }}
