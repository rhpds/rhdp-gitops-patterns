# InferenceService here is a datasource for Grafana; copy model serving from ai-dev-workshop unless you also need these dashboards.
# GOTCHA: RHOAI 3.x stores deploymentMode Standard, not RawDeployment — RawDeployment drifts forever.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.aiModels.modelName }}
  namespace: {{ .Values.aiModels.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    serving.kserve.io/deploymentMode: Standard
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-cpu-runtime
      storageUri: {{ .Values.aiModels.ociImage }}
