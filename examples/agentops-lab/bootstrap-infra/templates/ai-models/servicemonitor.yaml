# GOTCHA: user workload monitoring does not scrape without a ServiceMonitor.
# GOTCHA: do not name this <modelName>-metrics — KServe overwrites that name and scrapes nothing.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.aiModels.modelName }}-llm-observability
  namespace: {{ .Values.aiModels.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: {{ .Values.aiModels.modelName }}
