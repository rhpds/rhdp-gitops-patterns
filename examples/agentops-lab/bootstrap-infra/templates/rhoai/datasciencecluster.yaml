# GOTCHA: v2 schema — aipipelines (not datasciencepipelines); mlflowoperator backs the shared MLflow CR. Unknown v1 fields are silently pruned (permanent OutOfSync).
# GOTCHA: the operator writes default subfields back onto spec (rawDeploymentServiceConfig, workbenchNamespace, …). Omit them and ArgoCD stays OutOfSync.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    dashboard:
      managementState: Managed
    aipipelines:
      managementState: Managed
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headless
    kueue:
      managementState: Removed
      defaultClusterQueueName: default
      defaultLocalQueueName: default
    mlflowoperator:
      managementState: Managed
    modelregistry:
      managementState: Removed
      registriesNamespace: rhoai-model-registries
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
      mcpGuardrailsMode: false
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
