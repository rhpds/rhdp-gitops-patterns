# GOTCHA: annotated service-account-token Secrets don't auto-populate on K8s 1.24+ — mint via TokenRequest (`oc create token`).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-token-creator
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-token-creator
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-token-creator
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: {{ .Values.grafana.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-grafana-token
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Sync (not PostSync): datasources at wave 3 need grafana-auth-secret during the same sync.
    argocd.argoproj.io/hook: Sync
    # GOTCHA: hook Jobs need HookSucceeded,BeforeHookCreation — Job specs are immutable.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: grafana-sa
      restartPolicy: Never
      containers:
        - name: create-token
          # GOTCHA: ose-cli tags do not track OCP version (v4.21 does not exist).
          image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              if oc get secret grafana-auth-secret -n {{ .Values.grafana.namespace }} 2>/dev/null; then
                echo "Secret grafana-auth-secret already exists"
                exit 0
              fi
              TOKEN=$(oc create token grafana-sa -n {{ .Values.grafana.namespace }} --duration=8760h)
              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to create token for grafana-sa"
                exit 1
              fi
              oc create secret generic grafana-auth-secret -n {{ .Values.grafana.namespace }} --from-literal=token="$TOKEN"
              echo "Created grafana-auth-secret"
