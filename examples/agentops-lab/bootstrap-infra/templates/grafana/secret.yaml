# kubernetes.io/service-account-token Secrets annotated with
# kubernetes.io/service-account.name don't reliably auto-populate on K8s
# 1.24+ — use a PostSync Job with `oc create token` (TokenRequest API) to
# mint any long-lived SA token instead, not the annotated-Secret pattern.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-token-creator
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-token-creator
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-token-creator
subjects:
  - kind: ServiceAccount
    name: grafana-sa
    namespace: {{ .Values.grafana.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-grafana-token
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: PostSync
    # Always pair HookSucceeded with BeforeHookCreation on hook Jobs: Job pod
    # specs are immutable, so HookSucceeded alone leaves a failed Job stuck
    # forever (ArgoCD can't patch a fix onto it, and won't delete+recreate
    # without BeforeHookCreation).
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: grafana-sa
      restartPolicy: Never
      containers:
        - name: create-token
          # Don't assume registry.redhat.io/openshift4/ose-cli tags track the
          # target OCP version (v4.21 doesn't exist) — check published tags first.
          image: registry.redhat.io/openshift4/ose-cli:v4.14
          command:
            - /bin/bash
            - -c
            - |
              if oc get secret grafana-auth-secret -n {{ .Values.grafana.namespace }} 2>/dev/null; then
                echo "Secret grafana-auth-secret already exists"
                exit 0
              fi
              TOKEN=$(oc create token grafana-sa -n {{ .Values.grafana.namespace }} --duration=8760h)
              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to create token for grafana-sa"
                exit 1
              fi
              oc create secret generic grafana-auth-secret -n {{ .Values.grafana.namespace }} --from-literal=token="$TOKEN"
              echo "Created grafana-auth-secret"
