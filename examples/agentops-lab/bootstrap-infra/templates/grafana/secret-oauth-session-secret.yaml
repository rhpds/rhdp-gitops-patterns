# See values.yaml grafana.sessionSecret: must be non-empty or this
# re-renders differently every sync and never reaches Synced.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-proxy
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  session_secret: '{{ default (randAlphaNum 20) .Values.grafana.sessionSecret | b64enc }}'
type: Opaque
