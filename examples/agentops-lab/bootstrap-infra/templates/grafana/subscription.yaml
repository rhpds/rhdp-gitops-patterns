# community-operators, not redhat-operators. AllNamespaces in openshift-operators — no OperatorGroup.
# GOTCHA: OLM queries every CatalogSource during resolution. wait-rhpds-catalog (wave -3
# Sync hook) must succeed before this wave so grafana.source and rhoai.source are READY.
# ResolutionFailed never retries and blocks every later wave.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: grafana-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: {{ .Values.grafana.channel }}
  installPlanApproval: Automatic
  name: grafana-operator
  source: {{ .Values.grafana.source }}
  sourceNamespace: {{ .Values.grafana.sourceNamespace }}
