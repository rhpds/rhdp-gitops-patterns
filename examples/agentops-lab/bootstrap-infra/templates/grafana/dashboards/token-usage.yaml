# PromQL uses vLLM's real /metrics names (vllm:*) — do not invent metric
# names for a known runtime, check its actual exporter output first.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: llm-token-usage
  namespace: {{ .Values.grafana.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  json: |
    {
      "title": "LLM Token Usage",
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Prompt tokens / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(vllm:prompt_tokens_total[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Generation tokens / sec",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(rate(vllm:generation_tokens_total[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Running / waiting requests",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            { "expr": "sum(vllm:num_requests_running)", "legendFormat": "running", "refId": "A" },
            { "expr": "sum(vllm:num_requests_waiting)", "legendFormat": "waiting", "refId": "B" }
          ]
        }
      ]
    }
