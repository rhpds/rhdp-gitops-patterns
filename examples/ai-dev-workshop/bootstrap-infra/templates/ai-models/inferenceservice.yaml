# deploymentMode "RawDeployment": confirmed live on RHOAI 3.3.4 (this chart's
# pinned stable-3.3 channel) that the value is stored verbatim, unlike RHOAI
# 3.4.x where KServe's webhook rewrites it to "Standard". If this chart's
# rhoai.channel is ever bumped to stable-3.4+, switch this to "Standard" or
# it will drift permanently (the field is also immutable post-creation, so an
# in-place channel upgrade would need the InferenceService recreated).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.aiModels.modelName }}
  namespace: {{ .Values.aiModels.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-cpu-runtime
      storageUri: {{ .Values.aiModels.ociImage }}
