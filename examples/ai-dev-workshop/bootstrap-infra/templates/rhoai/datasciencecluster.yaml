# apiVersion v2 is the storage version even on stable-3.3 (v1 is served but
# converted to v2 on write, silently dropping fields v2 doesn't have). kserve
# in v2 has no `serving:` sub-object or `defaultDeploymentMode` — RawDeployment
# is the only supported mode. modelmeshserving/codeflare/datasciencepipelines
# don't exist in v2 either (datasciencepipelines was renamed to aipipelines).
# Confirmed against the live CRD schema before assuming this matches older
# RHOAI docs/examples.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    dashboard:
      managementState: Managed
    kserve:
      managementState: Managed
    kueue:
      managementState: Removed
    modelregistry:
      managementState: Removed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    workbenches:
      managementState: Managed
