# COPY WHEN: full TSSC platform composition. NOT FOR: individual operators (see Chart.yaml).
# Waves: -10 argocd resourceExclusions; -2 catalogs; 0 ns; 1 OG/sub; 50 keycloak; 80 pipelines; 100 rhtas/rhtpa/rhacs; 150 gitea; 200 demo-app; 300 rhdh

# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# GOTCHA: one CatalogSource (rhpds-redhat-operators) for all redhat-operators packages. Gitea uses a separate catalog.
catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

# GOTCHA: patches the cluster ArgoCD instance (not this chart's Application) to drop PipelineRun from resourceExclusions.
argocdInstance:
  name: openshift-gitops
  namespace: openshift-gitops

keycloak:
  enabled: true
  namespace: sso
  name: keycloak
  # GOTCHA: do not use sso — RHPDS clusters already claim sso.<deployer.domain> for platform Keycloak. Override via Application helm values if needed.
  routeHostPrefix: showcase-sso
  image: quay.io/keycloak/keycloak:26.0.2
  replicas: 1
  # GOTCHA: Keycloak image UID needs anyuid under restricted SCC.
  anyuidScc: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  admin:
    username: admin
    password: "showcase-keycloak-admin-changeme"
    secretName: keycloak-admin
  oidc:
    realm: tpa
    frontendClientId: frontend
    cliClientId: cli
    cliClientSecret: "showcase-tpa-cli-changeme"
    demoUser:
      username: tpa-user
      password: "showcase-tpa-user-changeme"
      email: tpa-user@showcase.local
  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Keycloak"
    instructions: >-
      SSO issuer https://showcase-sso.<cluster-domain>/realms/tpa; sign in as tpa-user (password in this userinfo / oidc.demoUser).

pipelines:
  enabled: true
  operator:
    enabled: true
    name: openshift-pipelines-operator
    packageName: openshift-pipelines-operator-rh
    namespace: openshift-operators
    channel: latest
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic
    createOperatorGroup: false
  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — OpenShift Pipelines"
    instructions: >-
      Tekton CRDs for the demo-app PipelineRun and RHACS Tasks; console plugin is patched on in templates/pipelines/console-plugin.yaml.

rhtas:
  enabled: true
  namespace: trusted-artifact-signer
  name: trusted-artifact-signer
  apiVersion: rhtas.redhat.com/v1alpha1

  operator:
    enabled: true
    name: rhtas-operator
    packageName: rhtas-operator
    namespace: openshift-operators
    channel: stable
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic
    createOperatorGroup: false

  securesign:
    fulcio:
      externalAccess: true
      organizationName: TSSC Platform Showcase
      organizationEmail: tssc-platform-showcase@demo.redhat.com
      commonName: ""
      monitoring: false
      ctlog:
        port: 80
        prefix: trusted-artifact-signer
    rekor:
      externalAccess: true
      monitoring: false
      rekorSearchUI: true
      pvcSize: 5Gi
      backFillRedis:
        enabled: true
        schedule: "0 0 * * *"
    tuf:
      externalAccess: true
      port: 80
      pvcSize: 100Mi
      keys:
        - name: rekor.pub
        - name: ctfe.pub
        - name: fulcio_v1.crt.pem
    trillian:
      createDatabase: true
      pvcSize: 5Gi
      monitoring: false
      port: 8091
    ctlog:
      monitoring: false
      trillianPort: 8091
    tsa:
      enabled: false
      externalAccess: false

  oidc:
    kubernetes:
      enabled: true
      clientID: trusted-artifact-signer
      issuer: "https://kubernetes.default.svc"
      issuerURL: "https://kubernetes.default.svc"
    keycloak:
      enabled: false
      clientID: trusted-artifact-signer
      issuerURL: ""
      realm: trusted-artifact-signer

  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Trusted Artifact Signer"
    instructions: >-
      Keyless signing (Fulcio, Rekor, TUF). The demo-app PipelineRun signs sample-service with this Securesign.

rhtpa:
  enabled: true
  namespace: trusted-profile-analyzer
  name: trustedprofileanalyzer
  apiVersion: rhtpa.io/v1

  operator:
    enabled: true
    name: rhtpa-operator
    packageName: rhtpa-operator
    namespace: ""
    channel: stable-v3
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic
    createOperatorGroup: true

  postgresql:
    enabled: true
    name: tpa-pgsql
    secretName: tpa-pgsql-user
    image: registry.redhat.io/rhel9/postgresql-16:latest
    database: tpa
    username: tpa
    password: "showcase-tpa-pgsql-changeme"
    port: "5432"
    pvcSize: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  oidc:
    issuerURL: ""
    realm: tpa
    frontendClientId: frontend
    cliClientId: cli
    cliClientSecret: "showcase-tpa-cli-changeme"
    cliSecretName: tpa-realm-cli-clients

  oidcWait:
    enabled: true
    jobName: rhtpa-oidc-wait
    serviceAccountName: rhtpa-oidc-wait
    serverDeployment: server
    image: registry.access.redhat.com/ubi9/ubi:latest
    imagePullPolicy: IfNotPresent
    waitSeconds: "900"
    rolloutTimeout: "600s"
    backoffLimit: 6
    ttlSecondsAfterFinished: 86400

  trustedProfileAnalyzer:
    storage:
      type: filesystem
      size: 32Gi
    replicas: 1
    createDatabase: true
    migrateDatabase: true
    createImporters: true
    importers:
      cve:
        enabled: true
        description: "CVE list v5 (advisory ingestion)"
        period: 1d
        source: "https://github.com/CVEProject/cvelistV5"
      osvGithub:
        enabled: true
        description: "GitHub Advisory Database (OSV / advisory ingestion)"
        path: advisories
        period: 1d
        source: "https://github.com/github/advisory-database"
      redhatCsaf:
        enabled: false
        description: "All Red Hat CSAF / VEX-related advisories"
        fetchRetries: 50
        period: 1d
        source: redhat.com
      redhatSboms:
        enabled: false
        description: "All Red Hat SBOMs"
        fetchRetries: 50
        period: 1d
        source: "https://access.redhat.com/security/data/sbom/beta/"
    server:
      resources:
        requests:
          cpu: "1"
          memory: 8Gi

  ingestionInfo:
    enabled: true
    supportedCycloneDxVersion: "1.4+"

  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Trusted Profile Analyzer"
    instructions: >-
      SBOM/VEX system of record; demo PipelineRun syft-sbom-rhtpa uploads the sample-service CycloneDX SBOM here.

rhacs:
  enabled: true
  namespace: stackrox
  apiVersion: platform.stackrox.io/v1alpha1

  operator:
    enabled: true
    name: rhacs-operator
    packageName: rhacs-operator
    namespace: rhacs-operator
    channel: stable
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic
    createOperatorGroup: true

  central:
    enabled: true
    name: stackrox-central-services
    exposure:
      route: true
    persistence:
      pvcSize: 50Gi
    db:
      pvcSize: 50Gi
    scanner:
      replicas: 2
      autoScaling: Disabled
    egress:
      connectivityPolicy: Online

  securedCluster:
    enabled: true
    name: stackrox-secured-cluster-services
    clusterName: tssc-platform-showcase
    admissionControl:
      listenOnCreates: true
      listenOnUpdates: true
      listenOnEvents: true

    # GOTCHA: SecuredCluster needs Central init-bundle TLS secrets (no CR coupling). Job owns the secrets.
    initBundleJob:
      enabled: true
      jobName: rhacs-init-bundle-mint
      serviceAccountName: rhacs-init-bundle
      image: registry.access.redhat.com/ubi9/ubi:latest
      imagePullPolicy: IfNotPresent
      bundleName: tssc-platform-showcase
      waitSeconds: "600"
      backoffLimit: 6
      ttlSecondsAfterFinished: 86400

  pipelineHooks:
    enabled: true
    taskName: acs-image-check
    secretName: rhacs-ci-secrets
    ciTokenJob:
      enabled: true
      jobName: rhacs-ci-token-mint
      serviceAccountName: rhacs-ci-token
      image: registry.access.redhat.com/ubi9/ubi:latest
      imagePullPolicy: IfNotPresent
      tokenName: showcase-ci
      role: Continuous Integration
      waitSeconds: "600"
      backoffLimit: 6
      ttlSecondsAfterFinished: 86400
    insecureSkipTlsVerify: "true"
    failOnSkipped: "false"
    sbom:
      enabled: true
      taskName: syft-sbom-rhtpa
      syftImage: "ghcr.io/anchore/syft:v1.18.1"
      uploadImage: "registry.access.redhat.com/ubi9/ubi-minimal:latest"
      rhtpaUrl: ""
      rhtpaSecretName: rhtpa-upload-token

  # GOTCHA: without this, roxctl fails with "no matching image registries". Non-fatal (exit 0).
  imageIntegrationJob:
    enabled: true
    jobName: rhacs-image-integration
    integrationName: openshift-internal-registry
    waitSeconds: "600"
    backoffLimit: 6
    ttlSecondsAfterFinished: 86400

  # GOTCHA: one-time Job enables built-in "Fixable Severity at Least Critical" BUILD policy via REST. Non-fatal.
  policyImportJob:
    enabled: true
    jobName: rhacs-policy-import
    serviceAccountName: rhacs-policy-import
    image: registry.access.redhat.com/ubi9/ubi:latest
    imagePullPolicy: IfNotPresent
    policyName: "Fixable Severity at Least Critical"
    waitSeconds: "600"
    backoffLimit: 6
    ttlSecondsAfterFinished: 86400

  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Advanced Cluster Security"
    instructions: >-
      Central UI in stackrox. Job rhacs-ci-token-mint owns Secret rhacs-ci-secrets; policy-import enables the Critical BUILD policy; acs-image-check evaluates it at bootstrap.

gitea:
  enabled: true
  namespace: gitea
  name: gitea
  routeHostPrefix: gitea
  volumeSize: 5Gi

  admin:
    username: gitea-admin
    password: "showcase-gitea-admin-changeme"
    email: gitea-admin@showcase.local

  user:
    username: developer
    password: "showcase-developer-changeme"
    emailDomain: showcase.local

  # GOTCHA: operator cannot select a subdir; migratedRepo clones the whole rhdp-gitops-patterns repo. Pipeline sparse-checkouts appSubdir.
  migratedRepo:
    repoUrl: "https://github.com/rhpds/rhdp-gitops-patterns.git"
    repoName: rhdp-gitops-patterns
    appSubdir: examples/tssc-platform-showcase/sample-service

  operator:
    enabled: true
    name: gitea-operator
    packageName: gitea-operator
    namespace: openshift-operators
    channel: stable
    source: redhat-gpte-gitea
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic

  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Gitea"
    instructions: >-
      Operator-managed Gitea with user developer and rhdp-gitops-patterns already migrated. Sign in as gitea.user.username.

demoApp:
  enabled: true
  namespace: showcase-app
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  pipeline:
    name: sample-service-build-sign

  pipelineRun:
    # GOTCHA: fixed name (not generateName) — re-sync must not create duplicate runs.
    name: sample-service-build-sign-initial

  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Demo Application"
    instructions: >-
      sample-service is built, ACS-checked, SBOM'd, and RHTAS-signed by PipelineRun sample-service-build-sign-initial in showcase-app.

rhdh:
  enabled: true
  namespace: rhdh
  name: developer-hub
  apiVersion: rhdh.redhat.com/v1alpha5
  route:
    enabled: true
  database:
    enableLocalDb: true

  operator:
    enabled: true
    name: rhdh
    namespace: rhdh-operator
    channel: fast
    source: rhpds-redhat-operators
    sourceNamespace: openshift-marketplace
    installPlanApproval: Automatic
    createOperatorGroup: true

  appConfig:
    title: "TSSC Platform Showcase — Developer Hub"
    baseUrl: ""
    catalog:
      fileLocations:
        - /opt/app-root/src/catalog/sample-service.yaml

  # GOTCHA: static catalog entry; no scaffolder / software templates.
  catalog:
    enabled: true
    configMapName: rhdh-catalog
    mountPath: /opt/app-root/src

  dynamicPlugins:
    enabled: false
    configMapName: dynamic-plugins-rhdh

  userInfo:
    enabled: true
    title: "TSSC Platform Showcase — Developer Hub"
    instructions: >-
      Software Catalog has a static sample-service Component (catalog-info.yaml). No scaffolder.
