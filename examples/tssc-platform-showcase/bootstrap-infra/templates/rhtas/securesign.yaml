{{- if .Values.rhtas.enabled }}
{{- $fulcioCN := include "rhtas.fulcioCommonName" . }}
---
# Securesign CR — deploys Fulcio, Rekor, Trillian, CTlog, and TUF for keyless signing.
# Reuse: Trusted Software Factory / RHADS tas-instance patterns.
apiVersion: {{ .Values.rhtas.apiVersion }}
kind: Securesign
metadata:
  name: {{ .Values.rhtas.name }}
  namespace: {{ .Values.rhtas.namespace }}
  labels:
    {{- include "rhtas.labels" . | nindent 4 }}
    app.kubernetes.io/component: securesign
  annotations:
    argocd.argoproj.io/sync-wave: "102"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  ctlog:
    monitoring:
      enabled: {{ .Values.rhtas.securesign.ctlog.monitoring }}
    trillian:
      port: {{ .Values.rhtas.securesign.ctlog.trillianPort }}

  fulcio:
    certificate:
      commonName: {{ $fulcioCN | quote }}
      organizationEmail: {{ .Values.rhtas.securesign.fulcio.organizationEmail | quote }}
      organizationName: {{ .Values.rhtas.securesign.fulcio.organizationName | quote }}
    config:
      OIDCIssuers:
{{- if .Values.rhtas.oidc.kubernetes.enabled }}
        - ClientID: {{ .Values.rhtas.oidc.kubernetes.clientID | quote }}
          Issuer: {{ .Values.rhtas.oidc.kubernetes.issuer | quote }}
          IssuerURL: {{ .Values.rhtas.oidc.kubernetes.issuerURL | quote }}
          Type: kubernetes
{{- end }}
{{- if .Values.rhtas.oidc.keycloak.enabled }}
{{- $kcIssuer := include "rhtas.keycloakIssuer" . }}
        - ClientID: {{ .Values.rhtas.oidc.keycloak.clientID | quote }}
          Issuer: {{ $kcIssuer | quote }}
          IssuerURL: {{ $kcIssuer | quote }}
          Type: email
{{- end }}
    ctlog:
      port: {{ .Values.rhtas.securesign.fulcio.ctlog.port }}
      prefix: {{ .Values.rhtas.securesign.fulcio.ctlog.prefix | quote }}
    externalAccess:
      enabled: {{ .Values.rhtas.securesign.fulcio.externalAccess }}
    monitoring:
      enabled: {{ .Values.rhtas.securesign.fulcio.monitoring }}

  rekor:
    backFillRedis:
      enabled: {{ .Values.rhtas.securesign.rekor.backFillRedis.enabled }}
      schedule: {{ .Values.rhtas.securesign.rekor.backFillRedis.schedule | quote }}
    externalAccess:
      enabled: {{ .Values.rhtas.securesign.rekor.externalAccess }}
    monitoring:
      enabled: {{ .Values.rhtas.securesign.rekor.monitoring }}
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: {{ .Values.rhtas.securesign.rekor.pvcSize | quote }}
    rekorSearchUI:
      enabled: {{ .Values.rhtas.securesign.rekor.rekorSearchUI }}
    sharding: []
    signer:
      kms: secret
    trillian:
      port: {{ .Values.rhtas.securesign.trillian.port }}

  trillian:
    database:
      create: {{ .Values.rhtas.securesign.trillian.createDatabase }}
      pvc:
        accessModes:
          - ReadWriteOnce
        retain: true
        size: {{ .Values.rhtas.securesign.trillian.pvcSize | quote }}
      tls: {}
    monitoring:
      enabled: {{ .Values.rhtas.securesign.trillian.monitoring }}

  tuf:
    externalAccess:
      enabled: {{ .Values.rhtas.securesign.tuf.externalAccess }}
    keys:
{{- range .Values.rhtas.securesign.tuf.keys }}
      - name: {{ .name | quote }}
{{- end }}
    port: {{ .Values.rhtas.securesign.tuf.port }}
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: {{ .Values.rhtas.securesign.tuf.pvcSize | quote }}

{{- if .Values.rhtas.securesign.tsa.enabled }}
  tsa:
    externalAccess:
      enabled: {{ .Values.rhtas.securesign.tsa.externalAccess }}
    signer:
      certificateChain: {}
{{- end }}
{{- end }}
