{{- if and .Values.rhtas.enabled .Values.rhtas.userInfo.enabled }}
{{- $fulcioUrl := include "rhtas.fulcioUrl" . }}
{{- $rekorUrl := include "rhtas.rekorUrl" . }}
{{- $tufUrl := include "rhtas.tufUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-userinfo-rhtas
  namespace: {{ .Values.rhtas.namespace }}
  labels:
    {{- include "rhtas.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: "103"
data:
  demo_title: {{ .Values.rhtas.userInfo.title | quote }}
  access_instructions: {{ .Values.rhtas.userInfo.instructions | quote }}
  deployment_type: "helm"
  operator_name: {{ .Values.rhtas.operator.packageName | quote }}
  rhtas_namespace: {{ .Values.rhtas.namespace | quote }}
  rhtas_name: {{ .Values.rhtas.name | quote }}
  signing_model: "keyless"
  components: "fulcio,rekor,tuf,trillian,ctlog"
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
  # After Ready: oc get securesign {{ .Values.rhtas.name }} -n {{ .Values.rhtas.namespace }} -o jsonpath='{.status}'
  status_hint: "oc get securesign -n {{ .Values.rhtas.namespace }}"
  routes_hint: "oc -n {{ .Values.rhtas.namespace }} get routes"
  # Same Route hosts consumed by the demo-app PipelineRun's cosign-sign-keyless task.
  fulcio_url_hint: {{ $fulcioUrl | quote }}
  rekor_url_hint: {{ $rekorUrl | quote }}
  tuf_url_hint: {{ $tufUrl | quote }}
  cosign_image: "registry.redhat.io/rhtas/cosign-rhel9:1.3.0"
{{- end }}
