{{- if .Values.demoApp.enabled }}
---
# GOTCHA: OpenShift GitOps excludes PipelineRun by default. resourceExclusions is not mergeable — this list is the operator default minus PipelineRun (TaskRun stays).
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: {{ .Values.argocdInstance.name | default "openshift-gitops" }}
  namespace: {{ .Values.argocdInstance.namespace | default "openshift-gitops" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  resourceExclusions: |
    - apiGroups:
        - ""
        - discovery.k8s.io
      clusters:
        - '*'
      kinds:
        - Endpoints
        - EndpointSlice
    - apiGroups:
        - apiregistration.k8s.io
      clusters:
        - '*'
      kinds:
        - APIService
    - apiGroups:
        - coordination.k8s.io
      clusters:
        - '*'
      kinds:
        - Lease
    - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
      clusters:
        - '*'
      kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
    - apiGroups:
        - certificates.k8s.io
      clusters:
        - '*'
      kinds:
        - CertificateSigningRequest
    - apiGroups:
        - cert-manager.io
      clusters:
        - '*'
      kinds:
        - CertificateRequest
    - apiGroups:
        - cilium.io
      clusters:
        - '*'
      kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
    - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
      clusters:
        - '*'
      kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
    - apiGroups:
        - tekton.dev
      clusters:
        - '*'
      kinds:
        - TaskRun
  # GOTCHA: RHACS/RHDH/RHTAS/RHTPA/Gitea CRs are not in ArgoCD's built-in health table; without these they stay unknown.
  resourceHealthChecks:
    - group: platform.stackrox.io
      kind: Central
      check: |
        hs = {}
        local available = false
        local failed = false
        local message = ""
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Available" and condition.status == "True" then
              available = true
              message = condition.message
            end
            if condition.type == "ReleaseFailed" and condition.status == "True" then
              failed = true
              message = condition.message
            end
          end
        end
        if failed then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if available then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Available condition"
        return hs
    - group: platform.stackrox.io
      kind: SecuredCluster
      check: |
        hs = {}
        local available = false
        local failed = false
        local message = ""
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Available" and condition.status == "True" then
              available = true
              message = condition.message
            end
            if condition.type == "ReleaseFailed" and condition.status == "True" then
              failed = true
              message = condition.message
            end
          end
        end
        if failed then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if available then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Available condition"
        return hs
    - group: rhtpa.io
      kind: TrustedProfileAnalyzer
      check: |
        hs = {}
        local deployed = false
        local failed = false
        local message = ""
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Deployed" and condition.status == "True" then
              deployed = true
              message = condition.message
            end
            if (condition.type == "ReleaseFailed" or condition.type == "Irreconcilable") and condition.status == "True" then
              failed = true
              message = condition.message
            end
          end
        end
        if failed then
          hs.status = "Degraded"
          hs.message = message
          return hs
        end
        if deployed then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Deployed condition"
        return hs
    - group: rhdh.redhat.com
      kind: Backstage
      check: |
        -- GOTCHA: Backstage CRD only has Deployed (no Failed condition). Lua sandbox has no string library.
        hs = {}
        local deployed = false
        local message = ""
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Deployed" then
              message = condition.message
              if condition.status == "True" then
                deployed = true
              end
            end
          end
        end
        if deployed then
          hs.status = "Healthy"
          hs.message = message
          return hs
        end
        hs.status = "Progressing"
        if message ~= "" then
          hs.message = message
        else
          hs.message = "Waiting for Deployed condition"
        end
        return hs
    - group: rhtas.redhat.com
      kind: Securesign
      check: |
        hs = {}
        local ready = false
        local message = ""
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for i, condition in ipairs(obj.status.conditions) do
            if condition.type == "Ready" then
              message = condition.message
              if condition.status == "True" then
                ready = true
              end
            end
          end
        end
        if ready then
          hs.status = "Healthy"
          hs.message = "Securesign components are ready"
          return hs
        end
        hs.status = "Progressing"
        if message ~= "" then
          hs.message = message
        else
          hs.message = "Waiting for Ready condition"
        end
        return hs
    - group: pfe.rhpds.com
      kind: Gitea
      check: |
        hs = {}
        local failed = false
        local successful = false
        local message = ""
        if obj.status ~= nil then
          if obj.status.conditions ~= nil then
            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "Failure" and condition.status == "True" then
                failed = true
                message = condition.message
              end
              if condition.type == "Successful" and condition.status == "True" then
                successful = true
              end
            end
          end
          if failed then
            hs.status = "Degraded"
            if message ~= "" then
              hs.message = message
            else
              hs.message = "Gitea reconciliation failed"
            end
            return hs
          end
          if successful and obj.status.repoMigrationComplete == true and obj.status.userSetupComplete == true and obj.status.adminSetupComplete == true then
            hs.status = "Healthy"
            hs.message = "Gitea is ready and repositories migrated"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Gitea to finish provisioning and repo migration"
        return hs
{{- end }}
