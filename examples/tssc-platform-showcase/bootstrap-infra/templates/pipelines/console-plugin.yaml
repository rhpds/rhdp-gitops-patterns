{{- if .Values.pipelines.enabled }}
---
# GOTCHA: operator CSV does not enable the console plugin on a GitOps Subscription.
# spec.plugins is an atomic array; this list is the RHPDS baseline plus pipelines-console-plugin.
apiVersion: operator.openshift.io/v1
kind: Console
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  plugins:
    - odf-console
    - monitoring-plugin
    - networking-console-plugin
    - lightspeed-console-plugin
    - pipelines-console-plugin
{{- end }}
