{{- if and .Values.rhdh.enabled .Values.rhdh.operator.enabled .Values.rhdh.operator.createOperatorGroup }}
---
# GOTCHA: RHDH is namespace-scoped in rhdh-operator ns; OperatorGroup is required (unlike Gitea).
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.rhdh.operator.name }}-operator-group
  namespace: {{ .Values.rhdh.operator.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "301"
spec: {}
{{- end }}
