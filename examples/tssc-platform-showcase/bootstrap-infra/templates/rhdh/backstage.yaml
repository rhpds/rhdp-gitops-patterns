{{- if .Values.rhdh.enabled }}
---
# Backstage CR — RHDH Operator instance for the TSSC platform showcase.
# Reuse source: RHADS / RHDH Operator install pattern (rhdh.redhat.com).
apiVersion: {{ .Values.rhdh.apiVersion }}
kind: Backstage
metadata:
  name: {{ .Values.rhdh.name }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "303"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
    {{- if .Values.rhdh.catalog.enabled }}
    extraFiles:
      mountPath: {{ .Values.rhdh.catalog.mountPath | quote }}
      configMaps:
        - name: {{ .Values.rhdh.catalog.configMapName }}
          # Directory mount → /opt/app-root/src/catalog/<key>
          mountPath: {{ printf "%s/catalog" .Values.rhdh.catalog.mountPath | quote }}
    {{- end }}
    {{- if .Values.rhdh.dynamicPlugins.enabled }}
    dynamicPluginsConfigMapName: {{ .Values.rhdh.dynamicPlugins.configMapName }}
    {{- end }}
    # Note: v1alpha5 (RHDH Operator 1.10+) removed application.replicas;
    # override replica count via spec.deployment.patch if needed.
    route:
      enabled: {{ .Values.rhdh.route.enabled }}
  database:
    enableLocalDb: {{ .Values.rhdh.database.enableLocalDb }}
{{- end }}
