{{- if and .Values.rhdh.enabled .Values.rhdh.catalog.enabled }}
---
# GOTCHA: static Component (no scaffolder). Mirrors sample-service/catalog-info.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.rhdh.catalog.configMapName }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "302"
data:
  sample-service.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: sample-service
      description: TSSC platform showcase reference application
      annotations:
        backstage.io/techdocs-ref: dir:.
    spec:
      type: service
      lifecycle: production
      owner: platform-team
{{- end }}
