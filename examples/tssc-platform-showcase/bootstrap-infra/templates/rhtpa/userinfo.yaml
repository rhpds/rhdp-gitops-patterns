{{- if and .Values.rhtpa.enabled .Values.rhtpa.userInfo.enabled }}
{{- $serverUrl := include "rhtpa.serverUrl" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-userinfo-rhtpa
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    demo.redhat.com/userinfo: ""
  annotations:
    argocd.argoproj.io/sync-wave: "105"
data:
  demo_title: {{ .Values.rhtpa.userInfo.title | quote }}
  access_instructions: {{ .Values.rhtpa.userInfo.instructions | quote }}
  deployment_type: "helm"
  operator_name: {{ .Values.rhtpa.operator.packageName | quote }}
  rhtpa_namespace: {{ .Values.rhtpa.namespace | quote }}
  rhtpa_name: {{ .Values.rhtpa.name | quote }}
  rhtpa_url: {{ $serverUrl | quote }}
  sbom_format: "CycloneDX"
  supported_cyclonedx_version: {{ .Values.rhtpa.ingestionInfo.supportedCycloneDxVersion | quote }}
  cluster_domain: {{ .Values.deployer.domain | quote }}
  cluster_api_url: {{ .Values.deployer.apiUrl | quote }}
{{- end }}
