{{- if and .Values.rhtpa.enabled .Values.rhtpa.operator.enabled }}
{{- $opNs := include "rhtpa.operatorNamespace" . }}
{{- $existingSub := lookup "operators.coreos.com/v1alpha1" "Subscription" $opNs .Values.rhtpa.operator.name }}
{{- if not $existingSub.metadata }}
---
# RHTPA Operator via OLM — namespace-scoped install (RHADS pattern).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.rhtpa.operator.name }}
  namespace: {{ $opNs }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "101"
spec:
  channel: {{ .Values.rhtpa.operator.channel }}
  installPlanApproval: {{ .Values.rhtpa.operator.installPlanApproval }}
  name: {{ .Values.rhtpa.operator.packageName }}
  source: {{ .Values.rhtpa.operator.source }}
  sourceNamespace: {{ .Values.rhtpa.operator.sourceNamespace }}
{{- end }}
{{- end }}
