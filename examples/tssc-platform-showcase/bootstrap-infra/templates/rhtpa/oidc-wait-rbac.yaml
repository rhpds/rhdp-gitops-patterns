{{- if and .Values.rhtpa.enabled .Values.rhtpa.oidcWait.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
rules:
  # GOTCHA: oc rollout status watches deployments, replicasets, and pods.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
    namespace: {{ .Values.rhtpa.namespace }}
---
# GOTCHA: UBI Jobs that dnf-install need anyuid.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
    namespace: {{ .Values.rhtpa.namespace }}
{{- end }}
