{{- if and .Values.rhtpa.enabled .Values.rhtpa.oidcWait.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
    namespace: {{ .Values.rhtpa.namespace }}
---
# UBI Job installs oc/curl via dnf — needs anyuid (same pattern as other one-time Jobs).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.rhtpa.namespace }}
  labels:
    {{- include "rhtpa.labels" . | nindent 4 }}
    app.kubernetes.io/component: oidc-wait
  annotations:
    argocd.argoproj.io/sync-wave: "104"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhtpa.oidcWait.serviceAccountName }}
    namespace: {{ .Values.rhtpa.namespace }}
{{- end }}
