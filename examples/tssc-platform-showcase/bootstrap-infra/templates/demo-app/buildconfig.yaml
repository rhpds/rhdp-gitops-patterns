{{- if .Values.demoApp.enabled }}
{{- $repoUrl := include "demoApp.giteaRepoUrl" . }}
---
# GOTCHA: Pipeline uses oc start-build --from-dir (workspace root). Git source is docs; contextDir is appSubdir of the monorepo clone.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sample-service
  namespace: {{ .Values.demoApp.namespace }}
  labels:
    {{- include "demoApp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "202"
spec:
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  source:
    type: Git
    git:
      uri: {{ $repoUrl | quote }}
      ref: main
    contextDir: {{ .Values.gitea.migratedRepo.appSubdir | quote }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: sample-service:latest
{{- end }}
