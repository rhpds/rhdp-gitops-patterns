{{- if .Values.demoApp.enabled }}
---
# Tekton Pipeline — hybrid build (BuildConfig) + ACS + SBOM + RHTAS keyless cosign.
# Runs exactly once at bootstrap via the fixed-name PipelineRun in pipelinerun.yaml.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: {{ .Values.demoApp.pipeline.name }}
  namespace: {{ .Values.demoApp.namespace }}
  labels:
    {{- include "demoApp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "204"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  params:
    - name: repo-url
      type: string
      description: >-
        Gitea clone URL for the migrated repo (the whole rhdp-gitops-patterns
        monorepo — sample-service lives at app-subdir inside it)
    - name: revision
      type: string
      default: main
    - name: app-subdir
      type: string
      description: >-
        Path within the cloned repo to the sample-service app
        (examples/tssc-platform-showcase/sample-service)
    - name: image-url
      type: string
      description: >-
        Internal registry tag (image-registry.openshift-image-registry.svc:5000/<ns>/sample-service:latest)
    - name: buildconfig-name
      type: string
      default: sample-service
    - name: cosign-fulcio-url
      type: string
      default: ""
    - name: cosign-rekor-url
      type: string
      default: ""
    - name: cosign-tuf-url
      type: string
      default: ""
      description: TUF root/mirror URL from RHTAS
    - name: rox-secret-name
      type: string
      default: {{ .Values.rhacs.pipelineHooks.secretName | quote }}
    - name: rox-secret-source-namespace
      type: string
      default: {{ .Values.rhacs.namespace | quote }}
      description: >-
        Namespace where the RHACS ci-token-mint Job creates rox-secret-name
        (see acs-image-check comment below for why it must be mirrored here).
  workspaces:
    - name: source
    - name: sbom
  tasks:
    # Gitea's own sync-wave (155) runs well before this PipelineRun's (210),
    # but the Gitea CRD has no ArgoCD health check registered, so ArgoCD
    # advances past that wave as soon as the CR is created — not once the
    # operator has actually finished standing up the Gitea pod/route/repo
    # migration. On a slower cluster/operator that leaves a real race window
    # where the clone below hits "connection refused" because the Gitea pod
    # isn't listening yet. Wait for a plain TCP connect to the repo host:port
    # (what git itself needs) before ever attempting the clone.
    - name: wait-for-gitea
      params:
        - name: repo-url
          value: $(params.repo-url)
      taskSpec:
        params:
          - name: repo-url
            type: string
        steps:
          - name: wait
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              URL="$(params.repo-url)"
              HOSTPORT="${URL#*://}"
              HOSTPORT="${HOSTPORT%%/*}"
              HOST="${HOSTPORT%%:*}"
              PORT="${HOSTPORT##*:}"
              if [[ "${PORT}" == "${HOST}" ]]; then
                PORT=80
              fi
              echo "Waiting for ${HOST}:${PORT} (Gitea) to accept TCP connections (up to 300s)..."
              for i in $(seq 1 60); do
                if timeout 3 bash -c "echo > /dev/tcp/${HOST}/${PORT}" 2>/dev/null; then
                  echo "Gitea is reachable at ${HOST}:${PORT}."
                  exit 0
                fi
                echo "Attempt ${i}/60: ${HOST}:${PORT} not reachable yet, retrying in 5s..."
                sleep 5
              done
              echo "Timed out waiting for Gitea (${HOST}:${PORT}) to become reachable" >&2
              exit 1

    - name: clone
      runAfter: [wait-for-gitea]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: source
      params:
        - name: URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)
        # repo-url now points at the whole rhdp-gitops-patterns monorepo (see
        # values.yaml gitea.migratedRepo comment). DEPTH is already 1 by
        # default on this Task (confirmed against the live Task on cluster),
        # set explicitly here so it stays shallow even if that default ever
        # changes. SPARSE_CHECKOUT_DIRECTORIES scopes the actual checked-out
        # working tree to just the app subdir instead of every other example
        # in the repo — the clone still touches the whole repo's refs, but
        # disk/workspace content is limited to what the build actually needs.
        - name: DEPTH
          value: "1"
        - name: SPARSE_CHECKOUT_DIRECTORIES
          value: $(params.app-subdir)

    # OpenShift Binary BuildConfig (Dockerfile) — triggered directly from the
    # git-cloned workspace via --from-dir, regardless of the BuildConfig's own
    # configured Git source (see buildconfig.yaml header comment).
    #
    # IMPORTANT: --from-dir must point at the WORKSPACE ROOT, not the
    # app-subdir. git sparse-checkout does not flatten the checked-out tree —
    # it preserves each file's original repo-relative path and just prunes
    # everything outside the requested directories. So after the clone step's
    # SPARSE_CHECKOUT_DIRECTORIES, the workspace root already contains
    # <app-subdir>/Dockerfile at its normal nested path, and the BuildConfig's
    # own contextDir (buildconfig.yaml, set to the same app-subdir) is what
    # narrows the uploaded root down to it. Pointing --from-dir at the
    # app-subdir directly double-applies that path (uploaded root would BE the
    # subdir, then contextDir looks for <app-subdir> again inside it) and
    # fails with "provided context directory does not exist" — confirmed live.
    - name: openshift-build
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: source
      params:
        - name: buildconfig-name
          value: $(params.buildconfig-name)
      taskSpec:
        params:
          - name: buildconfig-name
            type: string
        workspaces:
          - name: source
        steps:
          - name: start-build
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              BC="$(params.buildconfig-name)"
              SRC="$(workspaces.source.path)"
              echo "Starting Binary build ${BC} from ${SRC} (BuildConfig contextDir narrows to the app subdir)"
              oc start-build "${BC}" --from-dir="${SRC}" --follow --wait
              echo "Build ${BC} finished"

    # RHACS' ci-token-mint Job (templates/rhacs/ci-token-job.yaml) creates
    # Secret rox-secret-name in rox-secret-source-namespace (stackrox) — but
    # Tekton always runs a Task's TaskRun pod in the PipelineRun's OWN
    # namespace (showcase-app here), never in the namespace where the Task
    # object is merely defined, and a plain `secret:` volume can only
    # reference a Secret that exists in the pod's own namespace. Confirmed
    # live: acs-image-check's `optional: true` secret volume silently mounted
    # an empty directory (no error) because rhacs-ci-secrets only existed in
    # stackrox, not showcase-app, so the Task kept soft-skipping with "missing
    # rox-api-endpoint" even though the Secret genuinely existed elsewhere.
    # Mirror it into this namespace first using the "pipeline" ServiceAccount,
    # which already has `edit` here (serviceaccount-rbac.yaml) plus a
    # narrowly-scoped read-only RoleBinding into stackrox for just this one
    # Secret (templates/rhacs/ci-token-rbac.yaml).
    - name: mirror-rhacs-secret
      runAfter: [openshift-build]
      params:
        - name: rox-secret-name
          value: $(params.rox-secret-name)
        - name: rox-secret-source-namespace
          value: $(params.rox-secret-source-namespace)
      taskSpec:
        params:
          - name: rox-secret-name
            type: string
          - name: rox-secret-source-namespace
            type: string
        steps:
          - name: mirror
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              SRC_NS="$(params.rox-secret-source-namespace)"
              NAME="$(params.rox-secret-name)"
              if ! oc get secret "${NAME}" -n "${SRC_NS}" >/dev/null 2>&1; then
                echo "Secret ${SRC_NS}/${NAME} not found yet — leaving acs-image-check to soft-skip."
                exit 0
              fi
              ENDPOINT="$(oc get secret "${NAME}" -n "${SRC_NS}" -o jsonpath='{.data.rox-api-endpoint}' | base64 -d)"
              TOKEN="$(oc get secret "${NAME}" -n "${SRC_NS}" -o jsonpath='{.data.rox-api-token}' | base64 -d)"
              if oc get secret "${NAME}" >/dev/null 2>&1; then
                oc patch secret "${NAME}" --type merge \
                  -p "{\"stringData\":{\"rox-api-endpoint\":\"${ENDPOINT}\",\"rox-api-token\":\"${TOKEN}\"}}"
              else
                oc create secret generic "${NAME}" \
                  --from-literal=rox-api-endpoint="${ENDPOINT}" \
                  --from-literal=rox-api-token="${TOKEN}"
              fi
              echo "Mirrored Secret ${SRC_NS}/${NAME} into this namespace for acs-image-check."

    - name: acs-image-check
      runAfter: [mirror-rhacs-secret]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: acs-image-check
          - name: namespace
            value: stackrox
      params:
        - name: image
          value: $(params.image-url)

    - name: syft-sbom-rhtpa
      runAfter: [acs-image-check]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: syft-sbom-rhtpa
          - name: namespace
            value: stackrox
      workspaces:
        - name: source
          workspace: source
        - name: sbom
          workspace: sbom
      params:
        - name: image
          value: $(params.image-url)

    - name: cosign-sign-keyless
      runAfter: [syft-sbom-rhtpa]
      taskSpec:
        params:
          - name: image
            type: string
          - name: fulcio-url
            type: string
          - name: rekor-url
            type: string
          - name: tuf-url
            type: string
        volumes:
          # Audience must match Securesign Fulcio OIDC ClientID (trusted-artifact-signer)
          - name: oidc-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 600
                    audience: trusted-artifact-signer
        steps:
          - name: sign
            image: registry.redhat.io/rhtas/cosign-rhel9:1.3.0
            volumeMounts:
              - name: oidc-token
                mountPath: /var/run/sigstore/cosign
                readOnly: true
            env:
              - name: IMAGE
                value: $(params.image)
              - name: FULCIO_URL
                value: $(params.fulcio-url)
              - name: REKOR_URL
                value: $(params.rekor-url)
              - name: TUF_URL
                value: $(params.tuf-url)
              - name: HOME
                value: /tmp
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [[ -n "${TUF_URL}" ]]; then
                cosign initialize --mirror="${TUF_URL}" --root="${TUF_URL}/root.json"
              fi
              TOKEN_FILE=/var/run/sigstore/cosign/token
              EXTRA=(
                --identity-token="${TOKEN_FILE}"
                --oidc-issuer=https://kubernetes.default.svc
                --oidc-client-id=trusted-artifact-signer
                --fulcio-auth-flow=token
                --allow-http-registry
                --allow-insecure-registry
              )
              if [[ -n "${FULCIO_URL}" ]]; then
                EXTRA+=(--fulcio-url="${FULCIO_URL}")
              fi
              if [[ -n "${REKOR_URL}" ]]; then
                EXTRA+=(--rekor-url="${REKOR_URL}")
              fi
              cosign sign --yes "${EXTRA[@]}" "${IMAGE}"
              echo "Signed ${IMAGE} (keyless / RHTAS)"
      params:
        - name: image
          value: $(params.image-url)
        - name: fulcio-url
          value: $(params.cosign-fulcio-url)
        - name: rekor-url
          value: $(params.cosign-rekor-url)
        - name: tuf-url
          value: $(params.cosign-tuf-url)
{{- end }}
