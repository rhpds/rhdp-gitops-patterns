{{- if .Values.demoApp.enabled }}
{{- $host := include "demoApp.routeHost" . }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sample-service
  namespace: {{ .Values.demoApp.namespace }}
  labels:
    {{- include "demoApp.labels" . | nindent 4 }}
    app: sample-service
  annotations:
    argocd.argoproj.io/sync-wave: "205"
spec:
  host: {{ $host | quote }}
  to:
    kind: Service
    name: sample-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
