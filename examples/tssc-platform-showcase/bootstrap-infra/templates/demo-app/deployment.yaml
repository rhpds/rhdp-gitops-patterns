{{- if .Values.demoApp.enabled }}
{{- $imageRef := include "demoApp.imageRef" . }}
---
# GOTCHA: wave 211 after PipelineRun (210). Earlier wave deadlocks: Deployment never Healthy without the image, ArgoCD won't advance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-service
  namespace: {{ .Values.demoApp.namespace }}
  labels:
    {{- include "demoApp.labels" . | nindent 4 }}
    app: sample-service
  annotations:
    argocd.argoproj.io/sync-wave: "211"
    # GOTCHA: ImageStream trigger rewrites the image to a digest; ignore so the app stays Synced.
    argocd.argoproj.io/ignore-differences: |
      jsonPointers:
        - /spec/template/spec/containers/0/image
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"sample-service:latest"},"fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: {{ .Values.demoApp.replicas }}
  selector:
    matchLabels:
      app: sample-service
  template:
    metadata:
      labels:
        {{- include "demoApp.labels" . | nindent 8 }}
        app: sample-service
    spec:
      containers:
        - name: sample-service
          image: {{ $imageRef | quote }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.demoApp.resources.requests.cpu | quote }}
              memory: {{ .Values.demoApp.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.demoApp.resources.limits.cpu | quote }}
              memory: {{ .Values.demoApp.resources.limits.memory | quote }}
{{- end }}
