{{- if or .Values.pipelines.enabled .Values.rhtas.enabled .Values.rhtpa.enabled .Values.rhacs.enabled .Values.rhdh.enabled }}
---
# GOTCHA: one CatalogSource for all redhat-operators packages (pipelines, rhtas, rhtpa, rhacs, rhdh).
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: rhpds-redhat-operators
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceType: grpc
  image: {{ .Values.catalog.redhatOperatorsImage }}
  displayName: RHPDS Pinned Snapshot (redhat-operators, OCP 4.22)
  publisher: Red Hat GPTE
{{- end }}
{{- if .Values.gitea.enabled }}
---
# GOTCHA: Gitea is a separate catalog (redhat-gpte-gitea), not in the redhat-operators snapshot.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-gpte-gitea
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceType: grpc
  image: quay.io/rhpds/gitea-catalog:latest
  displayName: Red Hat GPTE (Gitea Operator)
  publisher: Red Hat GPTE
{{- end }}
