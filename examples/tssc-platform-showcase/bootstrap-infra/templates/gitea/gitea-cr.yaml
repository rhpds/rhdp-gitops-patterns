{{- if .Values.gitea.enabled }}
{{- $host := include "gitea.routeHost" . }}
---
# GOTCHA: operator cannot select a subdir; migratedRepo clones the whole rhdp-gitops-patterns repo. Pipeline sparse-checkouts appSubdir.
apiVersion: pfe.rhpds.com/v1
kind: Gitea
metadata:
  name: {{ .Values.gitea.name }}
  namespace: {{ .Values.gitea.namespace }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "155"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  giteaSsl: true
  giteaHostname: {{ $host | quote }}
  giteaAdminUser: {{ .Values.gitea.admin.username | quote }}
  giteaAdminPassword: {{ .Values.gitea.admin.password | quote }}
  giteaAdminEmail: {{ .Values.gitea.admin.email | quote }}
  giteaDisableRegistration: true
  giteaCreateUsers: true
  giteaUserNumber: 1
  giteaGenerateUserFormat: {{ .Values.gitea.user.username | quote }}
  giteaUserPassword: {{ .Values.gitea.user.password | quote }}
  giteaUserEmailDomain: {{ .Values.gitea.user.emailDomain | quote }}
  giteaMigrateRepositories: true
  giteaRepositoriesList:
    - repo: {{ .Values.gitea.migratedRepo.repoUrl | quote }}
      name: {{ .Values.gitea.migratedRepo.repoName | quote }}
      private: false
  giteaVolumeSize: {{ .Values.gitea.volumeSize | quote }}
{{- end }}
