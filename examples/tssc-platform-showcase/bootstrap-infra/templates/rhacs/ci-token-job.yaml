{{- if and .Values.rhacs.enabled .Values.rhacs.pipelineHooks.enabled .Values.rhacs.pipelineHooks.ciTokenJob.enabled }}
{{- $endpoint := include "rhacs.centralEndpoint" . }}
---
# Mint a Central "Continuous Integration" API token and OWN Secret rhacs-ci-secrets
# imperatively (this Job creates/patches it with oc — it is never templated by Helm).
# ArgoCD therefore never declares desired state for that Secret and has nothing to
# diff, avoiding the permanently-OutOfSync Secret problem a resourceIgnoreDifferences
# override would otherwise paper over. Idempotent: skips minting when a token is
# already present.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.jobName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.rhacs.pipelineHooks.ciTokenJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.rhacs.pipelineHooks.ciTokenJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "rhacs.labels" . | nindent 8 }}
        app.kubernetes.io/component: ci-token
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
      containers:
        - name: mint-ci-token
          image: {{ .Values.rhacs.pipelineHooks.ciTokenJob.image | quote }}
          imagePullPolicy: {{ .Values.rhacs.pipelineHooks.ciTokenJob.imagePullPolicy | quote }}
          env:
            - name: NAMESPACE
              value: {{ .Values.rhacs.namespace | quote }}
            - name: SECRET_NAME
              value: {{ .Values.rhacs.pipelineHooks.secretName | quote }}
            - name: TOKEN_NAME
              value: {{ .Values.rhacs.pipelineHooks.ciTokenJob.tokenName | quote }}
            - name: TOKEN_ROLE
              value: {{ .Values.rhacs.pipelineHooks.ciTokenJob.role | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.rhacs.pipelineHooks.ciTokenJob.waitSeconds | quote }}
            - name: FALLBACK_ENDPOINT
              value: {{ $endpoint | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              if ! command -v oc >/dev/null 2>&1; then
                curl -fsSL -o /tmp/oc.tgz \
                  https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
                tar -C /usr/local/bin -xzf /tmp/oc.tgz oc
              fi
              if ! command -v python3 >/dev/null 2>&1; then
                dnf install -y -q python3 && dnf clean all
              fi

              echo "Waiting for Central Route + central-htpasswd (up to ${WAIT_SECONDS}s)..."
              deadline=$((SECONDS + WAIT_SECONDS))
              CENTRAL_HOST=""
              while (( SECONDS < deadline )); do
                CENTRAL_HOST="$(oc -n "${NAMESPACE}" get route central -o jsonpath='{.spec.host}' 2>/dev/null || true)"
                if [[ -n "${CENTRAL_HOST}" ]] && oc -n "${NAMESPACE}" get secret central-htpasswd >/dev/null 2>&1; then
                  break
                fi
                sleep 10
              done
              if [[ -z "${CENTRAL_HOST}" ]]; then
                echo "Central Route not ready" >&2
                exit 1
              fi
              if ! oc -n "${NAMESPACE}" get secret central-htpasswd >/dev/null 2>&1; then
                echo "central-htpasswd missing" >&2
                exit 1
              fi

              ENDPOINT="${CENTRAL_HOST}:443"
              # Prefer live Route host; FALLBACK_ENDPOINT is chart-derived when Route lags.
              if [[ -z "${ENDPOINT}" || "${ENDPOINT}" == ":443" ]]; then
                ENDPOINT="${FALLBACK_ENDPOINT}"
              fi

              existing="$(oc -n "${NAMESPACE}" get secret "${SECRET_NAME}" -o jsonpath='{.data.rox-api-token}' 2>/dev/null || true)"
              if [[ -n "${existing}" ]]; then
                echo "Secret ${SECRET_NAME} already has rox-api-token — skipping mint"
                oc -n "${NAMESPACE}" patch secret "${SECRET_NAME}" --type merge \
                  -p "{\"stringData\":{\"rox-api-endpoint\":\"${ENDPOINT}\"}}" >/dev/null || true
                exit 0
              fi

              ADMIN_PASS="$(oc -n "${NAMESPACE}" get secret central-htpasswd -o jsonpath='{.data.password}' | base64 -d)"
              echo "Minting API token role='${TOKEN_ROLE}' name='${TOKEN_NAME}' against ${CENTRAL_HOST}..."
              RESP="$(curl -sk -u "admin:${ADMIN_PASS}" \
                "https://${CENTRAL_HOST}/v1/apitokens/generate" \
                -H 'Content-Type: application/json' \
                -d "{\"name\":\"${TOKEN_NAME}\",\"roles\":[\"${TOKEN_ROLE}\"]}")"
              TOKEN="$(printf '%s' "${RESP}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token") or "")')"
              if [[ -z "${TOKEN}" ]]; then
                echo "token mint failed: ${RESP}" >&2
                exit 1
              fi

              # This Job owns Secret ${SECRET_NAME} end to end (create-or-patch) — it is
              # never templated by Helm/ArgoCD, so there is no declared desired state to
              # drift out of sync with.
              if oc -n "${NAMESPACE}" get secret "${SECRET_NAME}" >/dev/null 2>&1; then
                oc -n "${NAMESPACE}" patch secret "${SECRET_NAME}" --type merge \
                  -p "{\"stringData\":{\"rox-api-endpoint\":\"${ENDPOINT}\",\"rox-api-token\":\"${TOKEN}\"}}"
              else
                oc -n "${NAMESPACE}" create secret generic "${SECRET_NAME}" \
                  --from-literal=rox-api-endpoint="${ENDPOINT}" \
                  --from-literal=rox-api-token="${TOKEN}"
              fi
              echo "Created/patched Secret ${NAMESPACE}/${SECRET_NAME} (endpoint + token)."
{{- end }}
