{{- if and .Values.rhacs.enabled .Values.rhacs.pipelineHooks.enabled .Values.rhacs.pipelineHooks.ciTokenJob.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
---
# UBI Job installs oc/python via dnf — needs anyuid (same pattern as other one-time Jobs).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
---
# Secret rhacs-ci-secrets is minted here (rhacs.namespace / stackrox) by the Job
# above, but Tekton always runs a Task's TaskRun pod in the PipelineRun's OWN
# namespace (demoApp.namespace / showcase-app), never in the namespace where
# the Task object itself is merely defined — and a plain `secret:` volume can
# only reference a Secret in the pod's own namespace (confirmed live: with
# `optional: true` this doesn't error, it just silently mounts an empty dir,
# which is why acs-image-check Task was soft-skipping with "missing
# rox-api-endpoint" even though the Secret genuinely existed — just in the
# wrong namespace for that Task's actual pod). This RoleBinding lets the
# demo-app Pipeline's "pipeline" ServiceAccount (see
# templates/demo-app/serviceaccount-rbac.yaml) read (only) this one Secret
# here so the Pipeline's mirror-rhacs-secret Task can copy it into
# demoApp.namespace, where the acs-image-check Task's pod actually runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhacs-ci-secret-reader
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.rhacs.pipelineHooks.secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-ci-secret-reader-demo-app-pipeline
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhacs-ci-secret-reader
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: {{ .Values.demoApp.namespace }}
{{- end }}
