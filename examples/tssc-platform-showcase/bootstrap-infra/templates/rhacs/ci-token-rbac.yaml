{{- if and .Values.rhacs.enabled .Values.rhacs.pipelineHooks.enabled .Values.rhacs.pipelineHooks.ciTokenJob.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
---
# GOTCHA: UBI Jobs that dnf-install need anyuid.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}-scc-anyuid
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
---
# GOTCHA: CI token Secret is minted in rhacs ns; Tekton TaskRun pods run in demoApp ns — Secret must be mirrored.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhacs-ci-secret-reader
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.rhacs.pipelineHooks.secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-ci-secret-reader-demo-app-pipeline
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: ci-token
  annotations:
    argocd.argoproj.io/sync-wave: "105"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhacs-ci-secret-reader
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: {{ .Values.demoApp.namespace }}
{{- end }}
