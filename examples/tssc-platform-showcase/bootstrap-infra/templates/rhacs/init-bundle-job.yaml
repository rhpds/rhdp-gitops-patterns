{{- if and .Values.rhacs.enabled .Values.rhacs.securedCluster.enabled .Values.rhacs.securedCluster.initBundleJob.enabled }}
{{- $endpoint := include "rhacs.centralEndpoint" . }}
---
# SecuredCluster cannot reconcile (Available=False, Irreconcilable=True,
# "some init-bundle secrets missing in namespace") until the TLS secrets
# generated by Central's cluster-init-bundle API exist in this namespace.
# Central and SecuredCluster are separate CRs with no built-in coupling, so
# something has to call Central's API and materialize those secrets — this
# Job does it imperatively (same pattern as ci-token-job.yaml): it owns the
# resulting Secrets end to end, they are never templated by Helm, so ArgoCD
# never declares desired state for them and there's nothing to diff.
# Idempotent: skips minting a new bundle when sensor-tls already exists, so
# re-syncs don't pile up unrevoked init bundles in Central.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.rhacs.securedCluster.initBundleJob.jobName }}
  namespace: {{ .Values.rhacs.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-bundle
  annotations:
    argocd.argoproj.io/sync-wave: "103"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.rhacs.securedCluster.initBundleJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.rhacs.securedCluster.initBundleJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "rhacs.labels" . | nindent 8 }}
        app.kubernetes.io/component: init-bundle
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.rhacs.securedCluster.initBundleJob.serviceAccountName }}
      containers:
        - name: mint-init-bundle
          image: {{ .Values.rhacs.securedCluster.initBundleJob.image | quote }}
          imagePullPolicy: {{ .Values.rhacs.securedCluster.initBundleJob.imagePullPolicy | quote }}
          env:
            - name: NAMESPACE
              value: {{ .Values.rhacs.namespace | quote }}
            - name: BUNDLE_NAME
              value: {{ .Values.rhacs.securedCluster.initBundleJob.bundleName | quote }}
            - name: WAIT_SECONDS
              value: {{ .Values.rhacs.securedCluster.initBundleJob.waitSeconds | quote }}
            - name: FALLBACK_ENDPOINT
              value: {{ $endpoint | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              if ! command -v oc >/dev/null 2>&1; then
                curl -fsSL -o /tmp/oc.tgz \
                  https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
                tar -C /usr/local/bin -xzf /tmp/oc.tgz oc
              fi
              if ! command -v python3 >/dev/null 2>&1; then
                dnf install -y -q python3 && dnf clean all
              fi

              if oc -n "${NAMESPACE}" get secret sensor-tls >/dev/null 2>&1; then
                echo "Secret sensor-tls already present — SecuredCluster already has an init bundle, skipping mint"
                exit 0
              fi

              echo "Waiting for Central Route + central-htpasswd (up to ${WAIT_SECONDS}s)..."
              deadline=$((SECONDS + WAIT_SECONDS))
              CENTRAL_HOST=""
              while (( SECONDS < deadline )); do
                CENTRAL_HOST="$(oc -n "${NAMESPACE}" get route central -o jsonpath='{.spec.host}' 2>/dev/null || true)"
                if [[ -n "${CENTRAL_HOST}" ]] && oc -n "${NAMESPACE}" get secret central-htpasswd >/dev/null 2>&1; then
                  break
                fi
                sleep 10
              done
              if [[ -z "${CENTRAL_HOST}" ]]; then
                echo "Central Route not ready" >&2
                exit 1
              fi
              if ! oc -n "${NAMESPACE}" get secret central-htpasswd >/dev/null 2>&1; then
                echo "central-htpasswd missing" >&2
                exit 1
              fi

              # Also wait for Central itself to actually be serving (not just Route admitted).
              echo "Waiting for Central API to respond..."
              api_deadline=$((SECONDS + WAIT_SECONDS))
              until curl -sk -o /dev/null -m 5 "https://${CENTRAL_HOST}/v1/ping"; do
                if (( SECONDS > api_deadline )); then
                  echo "Central API never responded" >&2
                  exit 1
                fi
                sleep 10
              done

              ADMIN_PASS="$(oc -n "${NAMESPACE}" get secret central-htpasswd -o jsonpath='{.data.password}' | base64 -d)"
              echo "Generating cluster-init bundle '${BUNDLE_NAME}' against ${CENTRAL_HOST}..."
              RESP="$(curl -sk -u "admin:${ADMIN_PASS}" \
                "https://${CENTRAL_HOST}/v1/cluster-init/init-bundles" \
                -H 'Content-Type: application/json' \
                -d "{\"name\":\"${BUNDLE_NAME}\"}")"
              KUBECTL_BUNDLE="$(printf '%s' "${RESP}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("kubectlBundle") or "")')"
              if [[ -z "${KUBECTL_BUNDLE}" ]]; then
                echo "init-bundle generation failed: ${RESP}" >&2
                exit 1
              fi

              echo "Applying init-bundle secrets to namespace ${NAMESPACE}..."
              printf '%s' "${KUBECTL_BUNDLE}" | base64 -d | oc apply -n "${NAMESPACE}" -f -
              echo "Init bundle applied — SecuredCluster should reconcile shortly."
{{- end }}
