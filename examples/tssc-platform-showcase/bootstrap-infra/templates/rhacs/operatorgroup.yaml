{{- if and .Values.rhacs.enabled .Values.rhacs.operator.enabled .Values.rhacs.operator.createOperatorGroup }}
---
# OperatorGroup for RHACS in rhacs-operator ns.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.rhacs.operator.name }}-operator-group
  namespace: {{ .Values.rhacs.operator.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "101"
spec: {}
{{- end }}
