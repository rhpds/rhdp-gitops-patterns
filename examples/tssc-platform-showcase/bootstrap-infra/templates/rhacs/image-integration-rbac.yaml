{{- if and .Values.rhacs.enabled .Values.rhacs.pipelineHooks.enabled .Values.rhacs.imageIntegrationJob.enabled }}
---
# GOTCHA: rhacs-ci-token SA token is the registry password; needs system:image-puller in demoApp ns.
# Wave 207 (>= ns wave 200). Without this, roxctl fails with "no matching image registries".
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacs-ci-token-image-puller
  namespace: {{ .Values.demoApp.namespace }}
  labels:
    {{- include "rhacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-integration
  annotations:
    argocd.argoproj.io/sync-wave: "207"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.rhacs.pipelineHooks.ciTokenJob.serviceAccountName }}
    namespace: {{ .Values.rhacs.namespace }}
{{- end }}
