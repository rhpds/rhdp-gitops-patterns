# Auto-injected by the deployer. Do not pass these manually.
deployer:
  domain: apps.cluster.example.com
  apiUrl: https://api.cluster.example.com:6443
  guid: xxxxx

# Shared namespace for tenant cleanup jobs. Set to "" to disable.
tenantLifecycle: ""

# GOTCHA: one CatalogSource (rhpds-redhat-operators) for RHACS + Quay — do not create one per Subscription.
catalog:
  redhatOperatorsImage: quay.io/rhpds/olm_snapshot_redhat_catalog:v4.22_2026_08_17

rhacs:
  namespace: stackrox
  channel: rhacs-4.8
  source: rhpds-redhat-operators
  sourceNamespace: openshift-marketplace
  centralName: stackrox-central-services
  securedClusterName: stackrox-secured-cluster-services

quay:
  namespace: quay
  channel: stable-3.13
  source: rhpds-redhat-operators
  sourceNamespace: openshift-marketplace
  registryName: quay-registry

# GOTCHA: centos:7 is EOL with known CVEs — this is the RHACS scan target, not a runtime app.
demo:
  namespace: security-demo
  vulnerableImage: quay.io/centos/centos:7
