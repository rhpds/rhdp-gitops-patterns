# Gitea is not in the standard redhat-operators catalog — needs its own RHPDS
# CatalogSource. See "Known Operator Quirks: Gitea Operator" in gitops-patterns.md.
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-gpte-gitea
  namespace: openshift-marketplace
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceType: grpc
  image: {{ .Values.gitea.catalogImage }}
  displayName: Red Hat GPTE (Gitea Operator)
  publisher: Red Hat GPTE
