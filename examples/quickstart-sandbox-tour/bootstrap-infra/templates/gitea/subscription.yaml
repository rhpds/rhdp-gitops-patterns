# AllNamespaces: openshift-operators. Do not create an OperatorGroup.
# GOTCHA: OLM queries every CatalogSource during resolution. wait-rhpds-catalog (wave -3
# Sync hook) must succeed before this wave so redhat-gpte-gitea and rhoai.source are READY.
# ResolutionFailed never retries and blocks every later wave.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gitea-operator
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  channel: stable
  installPlanApproval: Automatic
  name: gitea-operator
  source: redhat-gpte-gitea
  sourceNamespace: openshift-marketplace
