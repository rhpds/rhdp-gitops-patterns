# CRD comes from gitea-operator in this chart; SkipDryRunOnMissingResource required.
# GOTCHA: giteaMigrateRepositories is a no-op unless giteaCreateUsers ran (status.userSetupComplete).
# GOTCHA: giteaUserNumber: 1 uses giteaGenerateUserFormat as a literal username — no %d substitution. Do not put %d in the format.
# GOTCHA: migrated repos land under the created user, not admin.
apiVersion: pfe.rhpds.com/v1
kind: Gitea
metadata:
  name: gitea-instance
  namespace: {{ .Values.gitea.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  giteaSsl: true
  giteaAdminUser: {{ .Values.gitea.adminUser }}
  giteaAdminPassword: {{ .Values.gitea.adminPassword }}
  giteaAdminEmail: gitea-admin@example.com
  giteaDisableRegistration: true
  postgresqlVolumeSize: {{ .Values.gitea.dataSize }}
  giteaVolumeSize: {{ .Values.gitea.dataSize }}
  giteaCreateUsers: true
  giteaUserNumber: 1
  giteaUserPassword: {{ .Values.gitea.adminPassword }}
  giteaGenerateUserFormat: "mirror-user1"
  giteaMigrateRepositories: true
  {{- if .Values.gitea.migrateRepos }}
  giteaRepositoriesList:
    {{- range .Values.gitea.migrateRepos }}
    - repo: {{ .url }}
      name: {{ .name }}
      private: {{ .private }}
    {{- end }}
  {{- end }}
