# Bare DataScienceCluster. Models: ai-dev-workshop. Notebooks/MLflow/Grafana: agentops-lab.
# GOTCHA: storage version is v2 — v1 fields are silently dropped (permanent OutOfSync).
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    dashboard:
      managementState: Managed
