# Runtime access to an external model-serving API for one tenant module. No
# egress-restricting NetworkPolicy is added — default namespace egress stays open.
apiVersion: v1
kind: Secret
metadata:
  name: maas-credentials
  namespace: {{ .Values.username }}-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  endpoint: {{ .Values.maas.endpoint | quote }}
  apiKey: {{ .Values.maas.apiKey | quote }}
