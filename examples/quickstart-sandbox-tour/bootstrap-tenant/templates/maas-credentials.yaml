# External MAAS endpoint for a tenant module. Default namespace egress stays open.
apiVersion: v1
kind: Secret
metadata:
  name: maas-credentials
  namespace: {{ .Values.username }}-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  endpoint: {{ .Values.maas.endpoint | quote }}
  apiKey: {{ .Values.maas.apiKey | quote }}
