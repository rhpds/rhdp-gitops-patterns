# Pipelines operator canonical example is pipelines-workshop. Included here only because the tenant Pipeline deploys a Knative Service.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-pipelines-operator
  namespace: openshift-operators
  annotations:
    # Same wave as Knative CRs so a resolving Pipelines Subscription cannot block Serving/Eventing.
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: {{ .Values.pipelines.channel }}
  installPlanApproval: Automatic
  name: openshift-pipelines-operator-rh
  source: {{ .Values.pipelines.source }}
  sourceNamespace: {{ .Values.pipelines.sourceNamespace }}
