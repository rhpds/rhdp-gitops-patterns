# GOTCHA: S2I builders need index.html at /opt/app-root/src — this ConfigMap is the mount source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-content
  namespace: {{ .Values.username }}-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Frontend - {{ .Values.username }}</title></head>
    <body><h1>Frontend service for {{ .Values.username }}</h1></body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-content
  namespace: {{ .Values.username }}-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Backend - {{ .Values.username }}</title></head>
    <body><h1>Backend service for {{ .Values.username }}</h1></body>
    </html>
